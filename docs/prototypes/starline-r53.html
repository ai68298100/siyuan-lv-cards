<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
<title>小驴闪卡 · Starline R53 目标原型</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f2f4f8;--surface:#fff;--soft:#f6f8fb;--ink:#1c2536;--muted:#5c6a80;--line:#dfe4ec;--line-soft:#e8ecf2;--brand:#3c5ccf;--brand-ink:#fff;--brand-soft:#edf1fd;--brand-faint:#f4f6fe;--warn:#8c561e;--warn-soft:#fdf3e3;--good:#22654c;--good-soft:#e9f5ef;--danger:#a53544;--danger-soft:#fbecef;--shadow:0 24px 70px #16294d14;--shadow-2:0 10px 34px #16294d1f;--radius:16px;color-scheme:light}
[data-theme="dark"]{--bg:#141a24;--surface:#1e2634;--soft:#242e3e;--ink:#e9edf5;--muted:#a7b3c7;--line:#3c4759;--line-soft:#313c4d;--brand:#a9baff;--brand-ink:#18213a;--brand-soft:#2e3856;--brand-faint:#232c44;--warn:#f2c48c;--warn-soft:#3c3222;--good:#8fd2b1;--good-soft:#224234;--danger:#ffaebe;--danger-soft:#462730;--shadow:0 24px 70px #00000055;--shadow-2:0 10px 34px #00000066;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,a,input,select,textarea{outline-offset:3px}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

/* ---------- 按钮 ---------- */
button{min-height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:6px 13px;font-weight:550;font-size:13px;transition:background .12s cubic-bezier(.2,.8,.2,1),border-color .12s cubic-bezier(.2,.8,.2,1),transform .12s cubic-bezier(.2,.8,.2,1),filter .12s cubic-bezier(.2,.8,.2,1)}
button:hover{background:var(--soft);border-color:var(--muted)}
button:active{transform:scale(.98)}
button.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
button.primary:hover{filter:brightness(1.05);transform:translateY(-1px)}
button.outline{background:var(--surface)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{background:color-mix(in srgb,var(--ink) 5%,transparent);border-color:transparent;color:var(--ink)}
button.danger{background:transparent;border-color:transparent;color:var(--danger)}
button.small{min-height:32px;padding:3px 10px;font-size:12px}
button.big{min-height:48px;padding:8px 22px;font-weight:600}
button:disabled{cursor:default;opacity:.6}
select,input,textarea{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:7px 10px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:76px;line-height:1.7}
label.field{display:block;margin-bottom:14px}
label.field>span{display:block;font-size:12px;font-weight:600;margin-bottom:6px}
.hint{font-size:11px;color:var(--muted)}
.tiny{font-size:11px;color:var(--muted)}
.subtle{color:var(--muted)}
.small-text{font-size:12px}

/* ---------- 原型查看器外壳 ---------- */
.viewer{max-width:1560px;margin:0 auto;padding:28px 32px 20px}
.viewer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:20px}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:650;text-transform:uppercase}
.viewer-head h1{margin:6px 0;font-size:24px;line-height:1.3;letter-spacing:-.02em}
.viewer-head p{margin:0;color:var(--muted);font-size:12px}
.viewer-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.viewer-controls label{font-size:12px;color:var(--muted)}
.layout{display:grid;grid-template-columns:196px minmax(0,1fr);gap:24px;align-items:start}
.review-nav{padding-top:10px;position:sticky;top:16px}
.review-nav .eyebrow{margin:0 0 10px 10px}
.review-nav .group{font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:650;margin:16px 0 4px 10px;text-transform:uppercase}
.review-nav button{display:flex;align-items:center;width:100%;border:0;background:transparent;text-align:left;margin:1px 0;font-size:13px;color:var(--muted);padding:9px 10px;border-radius:9px;min-height:36px}
.review-nav button:hover{background:color-mix(in srgb,var(--ink) 4%,transparent);color:var(--ink)}
.review-nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.review-nav button span{display:inline-block;width:24px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}
.review-nav p{font-size:11px;color:var(--muted);padding:12px 10px;border-top:1px solid var(--line);margin-top:16px}
.stage{min-width:0;display:flex;justify-content:center}
.app{width:100%;max-width:1240px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.app-head{display:flex;align-items:center;gap:20px;height:62px;padding:0 24px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;white-space:nowrap;font-size:14px}
.logo svg{width:23px;height:23px;color:var(--brand)}
.app-search{display:flex;align-items:center;gap:8px;flex:0 1 300px;border:1px solid var(--line);border-radius:9px;padding:5px 10px;color:var(--muted);font-size:12px;background:var(--soft)}
.app-search kbd{margin-left:auto}
.app-tabs{display:flex;align-items:stretch;height:100%;gap:2px;margin-left:auto}
.app-tabs button{border:0;border-radius:0;height:100%;background:transparent;padding:0 13px;color:var(--muted);position:relative;font-size:13px}
.app-tabs button:hover{background:transparent;color:var(--ink)}
.app-tabs button.active{color:var(--ink);font-weight:650}
.app-tabs button.active:after{content:"";position:absolute;height:2px;background:var(--brand);bottom:0;left:12px;right:12px}
.head-actions{display:flex;align-items:center;gap:8px;padding-left:6px}
.app-content{padding:26px 30px 32px;min-height:680px;position:relative}
kbd{font:11px/1.5 ui-monospace,monospace;padding:0 5px;border:1px solid var(--line);border-radius:5px;color:var(--muted);background:var(--surface)}
.viewer-foot{margin-top:16px;display:flex;gap:16px;justify-content:space-between;color:var(--muted);font-size:11px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);border-radius:10px;padding:11px 18px;font-size:12px;max-width:85vw;z-index:9;box-shadow:var(--shadow-2)}

/* ---------- 页头 / 区块 ---------- */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
.page-head h2{font-size:22px;letter-spacing:-.02em;line-height:1.35;margin:4px 0 4px;font-weight:650}
.page-head p{font-size:13px;color:var(--muted);margin:0}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.actions.end{justify-content:flex-end}
.back{margin:0 0 10px;padding:2px 0;min-height:30px}
.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(240px,1fr);gap:18px}
.split-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.three-pane{display:grid;grid-template-columns:minmax(200px,.9fr) minmax(240px,1.2fr) minmax(200px,1fr);gap:18px}
.app.mobile .app-head{flex-wrap:wrap;height:auto;padding:12px 14px;gap:8px}
.app.mobile .app-tabs{order:3;width:100%;height:40px;margin-left:0}
.app.mobile .app-tabs button{flex:1;padding:0 6px}
.app.mobile .head-actions{margin-left:auto}
.app.mobile .head-actions .badge{display:none}
.app.mobile .app-content{padding:20px 16px;min-height:600px}
.app.mobile .split,.app.mobile .split-2,.app.mobile .three-pane{grid-template-columns:1fr}
.app.mobile .stats{grid-template-columns:1fr 1fr;gap:8px}
.app.mobile .stat{padding:12px}
.app.mobile .stat .num{font-size:23px}
.app.mobile .hero{padding:20px;flex-direction:column;align-items:stretch}
.app.mobile .hero h3{font-size:20px}
.app.mobile .study-card{padding:26px 20px}
.app.mobile .study-card h3{font-size:18px}
.app.mobile .rating{grid-template-columns:1fr 1fr}
.app.mobile .page-head{display:block}
.app.mobile .page-head .actions{margin-top:12px}
.app.mobile .page-head h2{font-size:20px}
.app.mobile .cal .day{padding:3px 4px}
.app.mobile .cal .day b{font-size:10px}
.app.mobile button{min-height:42px}
.app.mobile .foot-actions .actions{width:100%}
.app.mobile .foot-actions .actions button{flex:1}
.app.mobile .app-search{display:none}
.foot-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}

/* ---------- 徽章 / 章 / 通知 ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;font-size:11px;font-weight:550;color:var(--muted);white-space:nowrap}
.badge.brand{color:var(--brand);background:var(--brand-soft);border-color:transparent}
.badge.good{color:var(--good);background:var(--good-soft);border-color:transparent}
.badge.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.badge.planned{border-style:dashed;color:var(--warn);background:transparent}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;line-height:1;padding:4px 9px;border-radius:999px;background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--muted)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.error{background:var(--danger-soft);color:var(--danger)}
.notice{padding:11px 14px;background:var(--soft);border:1px solid var(--line-soft);border-radius:10px;font-size:12px;color:var(--muted);margin:14px 0}
.notice.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.notice.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.notice.entry{border-left:2px solid var(--brand)}

/* ---------- 面板 / hero / 统计 ---------- */
.panel{min-width:0;border:1px solid var(--line);border-radius:var(--radius);padding:22px;background:var(--surface)}
.panel.soft{background:var(--soft)}
.panel h3{font-size:15px;font-weight:650;margin:0 0 14px}
.hero{display:flex;gap:28px;align-items:center;justify-content:space-between;padding:26px 28px;background:linear-gradient(135deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 35%,var(--surface)) 70%);border:1px solid var(--line);border-radius:var(--radius)}
.hero h3{font-size:22px;line-height:1.4;margin:12px 0 6px;letter-spacing:-.02em;font-weight:650}
.hero p{color:var(--muted);margin:0 0 18px;max-width:44em;font-size:13px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.hero .cta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring b i{font-style:normal;font-size:10px;color:var(--muted);font-weight:550;margin-top:1px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}
.stat{padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.stat .lb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .num{display:flex;align-items:baseline;gap:8px;font-size:29px;line-height:1.25;letter-spacing:-.03em;font-weight:650;font-variant-numeric:tabular-nums;margin:4px 0 2px}
.stat .num .denom{font-size:13px;color:var(--muted);font-weight:550}
.stat .num .delta{font-size:11px;font-weight:600;letter-spacing:0}
.stat .delta.up{color:var(--good)}
.stat .delta.down{color:var(--danger)}
.stat svg{display:block;margin-top:6px}
.stat .num.zero{opacity:.55}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

/* ---------- 行 / 表 / 分段 ---------- */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:0}
.row-title{font-size:13px;font-weight:600}
.row p{margin:2px 0 0;color:var(--muted);font-size:12px}
.table{width:100%;border-collapse:collapse;font-size:12px}
.table td,.table th{padding:12px 8px;border-bottom:1px solid var(--line-soft);text-align:left}
.table th{color:var(--muted);font-size:11px;font-weight:550}
.table tr:last-child td{border:0}
.segmented{display:inline-flex;gap:2px;background:var(--soft);border:1px solid var(--line);padding:3px;border-radius:9px}
.segmented button{flex:1;font-size:12px;min-height:30px;border-color:transparent;background:transparent;padding:3px 12px}
.segmented button:hover{background:transparent;color:var(--brand)}
.segmented button.selected{background:var(--surface);border-color:var(--line);color:var(--brand);box-shadow:0 1px 3px #16294d14}
.progress{height:5px;border-radius:8px;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden;margin:12px 0}
.progress i{display:block;background:var(--brand);height:100%;border-radius:8px;transition:width .24s cubic-bezier(.2,.8,.2,1)}
.check{width:30px;height:30px;border-radius:50%;background:var(--good-soft);color:var(--good);display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.divider{border-top:1px solid var(--line-soft);margin:16px 0}
.step{display:flex;gap:12px;align-items:flex-start;margin:14px 0}
.step-number{flex:none;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;font-size:11px;color:var(--muted)}
.step.active .step-number{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.step strong{font-size:12px}
.step p{font-size:11px;color:var(--muted);margin:2px 0}
.quote{border-left:2px solid var(--brand);padding:3px 0 3px 14px;line-height:1.9;margin:14px 0;color:var(--ink);font-size:13px}
.highlight{background:var(--brand-soft);padding:1px 3px;border-radius:3px}
.source-item{padding:11px 12px;border-radius:9px;margin-bottom:9px;border:1px solid var(--line);background:var(--soft)}
.source-item.active{border-color:var(--brand);background:var(--brand-soft)}
.source-item strong{display:block;font-size:13px}
.source-item p{font-size:11px;color:var(--muted);margin:3px 0}
.preview-card{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:20px;margin:14px 0;min-height:180px}
.preview-card h4{font-size:16px;margin:22px 0 8px;line-height:1.75}

/* ---------- 复习面 ---------- */
.study{max-width:740px;margin:0 auto}
.study-hud{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.study-hud .eyebrow{margin-right:auto}
.study-card{padding:46px 42px;border:1px solid var(--line);border-radius:18px;min-height:320px;box-shadow:0 8px 30px #16294d0a;margin:16px 0;position:relative}
.study-card .face-eyebrow{display:flex;justify-content:space-between;align-items:center}
.study-card h3{font-size:21px;line-height:1.7;margin:26px 0 12px;letter-spacing:-.01em;font-weight:400}
.study-card>p{color:var(--muted);margin:0}
.study-answer{margin-top:22px;border-top:1px solid var(--line-soft);padding-top:18px}
.study-answer p{color:var(--ink)}
.rating{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.rating button{text-align:left;min-height:76px;padding:13px 16px;border-radius:12px;display:flex;flex-direction:column;gap:3px}
.rating .top{display:flex;align-items:center;justify-content:space-between;font-weight:600}
.rating span.iv{display:block;color:var(--muted);font-size:11px;margin-top:2px;font-variant-numeric:tabular-nums}
.study-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}

/* ---------- 命令面板（规划） ---------- */
.palette-backdrop{position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 26%,transparent);display:flex;align-items:flex-start;justify-content:center;padding-top:64px;z-index:5}
.palette{width:min(560px,92%);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-2);overflow:hidden}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line-soft);border-radius:0;padding:15px 18px;font-size:14px;background:var(--surface)}
.palette input:focus-visible{outline:none;box-shadow:none}
.palette .group-lb{font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:650;margin:12px 14px 4px;text-transform:uppercase}
.palette .item{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:13px;min-height:38px}
.palette .item.sel{background:var(--brand-soft);color:var(--brand)}
.palette .item kbd{margin-left:auto}
.palette .foot{display:flex;gap:14px;padding:9px 14px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--muted)}

/* ---------- 日历（规划） ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:10px;letter-spacing:.1em;color:var(--muted);text-align:center;font-weight:650;text-transform:uppercase;padding:3px 0}
.cal .day{aspect-ratio:1.35;border:1px solid var(--line-soft);border-radius:8px;padding:5px 7px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;justify-content:space-between;font-variant-numeric:tabular-nums;background:var(--surface)}
.cal .day b{font-size:12px;color:var(--ink);font-weight:600}
.cal .day.past1{background:color-mix(in srgb,var(--brand) 7%,var(--surface))}
.cal .day.past2{background:color-mix(in srgb,var(--brand) 16%,var(--surface))}
.cal .day.past3{background:color-mix(in srgb,var(--brand) 30%,var(--surface))}
.cal .day.past3 b,.cal .day.past2 b{color:var(--brand)}
.cal .day.today{border:2px solid var(--brand)}
.cal .day.future1{background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
.cal .day.future2{background:color-mix(in srgb,var(--warn) 18%,var(--surface))}
.cal .day.future3{background:color-mix(in srgb,var(--warn) 30%,var(--surface))}
.cal .day.off{border-color:transparent;background:transparent}
.forecast{display:flex;gap:4px;align-items:flex-end;height:74px;margin-top:14px}
.forecast i{flex:1;background:color-mix(in srgb,var(--warn) 22%,var(--surface));border-top:2px solid var(--warn);border-radius:4px 4px 0 0;min-height:6px}
.forecast i.hi{background:color-mix(in srgb,var(--warn) 40%,var(--surface))}

/* ---------- 状态样例 ---------- */
.skeleton{border-radius:9px;background:linear-gradient(90deg,color-mix(in srgb,var(--ink) 6%,transparent) 25%,color-mix(in srgb,var(--ink) 12%,transparent) 50%,color-mix(in srgb,var(--ink) 6%,transparent) 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.empty-box{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 20px;text-align:center}
.empty-box .ic{width:42px;height:42px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:18px}
.empty-box p{margin:0;color:var(--muted);font-size:12px;max-width:34em}

/* ---------- 响应式 / 动效 ---------- */
@media(max-width:1180px){.app-search{display:none}}
@media(max-width:1050px){.three-pane{grid-template-columns:1fr 1fr}.three-pane .pane-preview{grid-column:1/-1}.layout{grid-template-columns:150px 1fr;gap:14px}.viewer{padding:20px}.split{grid-template-columns:1.4fr 1fr}.app-head{padding:0 16px;gap:10px}}

const ring=(pct,sub)=>{const r=40,c=2*Math.PI*r,on=c*pct/100;return `<div class="ring"><svg viewBox="0 0 92 92" aria-hidden="true"><circle cx="46" cy="46" r="${r}" fill="none" stroke="color-mix(in srgb,var(--ink) 8%,transparent)" stroke-width="7"/><circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--brand)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${on.toFixed(1)} ${c.toFixed(1)}"/></svg><b>${pct}%<i>${sub}</i></b></div>`;};

const views={

`<div class="stats">${stat('今日到期','12','',spD)}${stat('新卡','3','<span class="delta up">▲ 上限内</span>',spN)}${stat('复习卡','9','',spR)}${stat('今日已学','7','<span class="denom">/ 20</span>',spT)}</div>`+
`<div class="split"><div class="stack"><section class="panel"><div class="flex between"><h3>一个目标，多种下一步</h3>${btn('查看全部任务','maintenance','ghost')}</div>${row('先整理这一段材料','辨析概念，只留下值得长期记的内容',btn('去收件箱','inbox','small'))}${row('不确定的卡，先查证','题面缺少适用条件，需要补充来源',btn('查看对象','manager','small'))}${row('期末临近','「网络基础」建议每日 3 张',btn('查看考试','exam','small'))}</section><section class="panel soft"><div class="flex between"><h3>AI 只给可检查的建议</h3>${badge('可审计','good')}</div><p class="small-text subtle">建议附来源片段与参数，可逐条核对后采用；忽略它，手工路径同样完整。</p><div class="actions">${demo('查看固定建议','small')}</div></section></div><section class="panel"><div class="eyebrow">THIS SESSION</div><h3 style="margin-top:10px">本场怎样结束</h3>${row('时间预算到','保留真实剩余到期',badge('正常收工'))}${row('范围完成','看结果和未决疑问',badge('可选择'))}${row('想先处理材料','保存现场，随时返回',badge('可切换'))}<div class="divider"></div><div class="actions">${btn('查看学习日历','calendar','small')}${btn('计划与负担','goals','ghost')}</div></section></div>`;},

`<div class="three-pane"><section class="panel"><h3>来源与依据</h3>${source}<div class="notice warn">待补：题面中的“每一步”需要限定讨论范围。</div>${demo('回源查证 ↗','ghost')}</section><section class="panel"><h3>保留你的判断</h3><label class="field"><span>问面</span><textarea>TCP 三次握手中，每一步分别确认了什么？</textarea></label><label class="field"><span>参考答案</span><textarea>双方交换初始序列号，逐步确认对方的发送与接收能力，并确认本次连接。</textarea></label><div class="flex">${badge('人工字段已锁定')}${demo('提出局部改写','small')}</div><p class="tiny">改写先给差异，再决定采用；当前卡的知识点不随意替换。</p></section><section class="panel"><h3>实际卡面</h3><div class="segmented" style="width:100%"><button class="selected">问题</button><button data-demo="答案态预览">答案</button></div><div class="preview-card"><div class="eyebrow">QUESTION / 回忆</div><h4>TCP 三次握手中，每一步分别确认了什么？</h4><span class="tiny">来源信息按需展开，避免泄露答案。</span></div>${btn('旁路试练','review','small')}</section></div>`+
`<div class="flex between" style="margin-top:14px"><div class="flex">${badge('记分卡 86 · 良好','good')}${badge('来源覆盖 100%','good')}${badge('成本 1.2k tok')}</div><span class="tiny">条件尚待核对 · 不把“已选”自动当作“已接受此版本”。</span></div>`+footer('当前版本 2 · 修改后需要重新核对',`${demo('待核实','small')}${demo('拒绝','small')}${demo('接受此版本','small')}`+btn('入库已审候选（2）','done','primary')),

const emptyTexts={
 inbox:['收件箱是空的','从块菜单「加入材料收件箱」收集材料；也可以用示例工作区体验完整流程。'],
 manager:['还没有可管理的对象','制卡入库后，学习对象会出现在这里，并保留来源与版本。'],
 goals:['还没有目标','先记录一张目标卡即可开始——目标不强迫建卡。'],
 exam:['没有考试计划','新建计划后，这里会把截止日期换算成每日可承担的量。'],
 maintenance:['队列干净','没有待处理事项；烂卡、暂停与恢复项会聚合在这里。'],
};
let stateVal=urlQuery.get('state')||'ready';
if(stateVal){const sel=document.getElementById('state');if([...sel.options].some(o=>o.value===stateVal))sel.value=stateVal;else stateVal='ready';}
if(document.documentElement.dataset.theme==='dark'){const tb=document.getElementById('theme-toggle');tb.setAttribute('aria-pressed','true');tb.textContent='浅色主题';}
function render(){
 const empty=emptyTexts[active];
 if(stateVal==='empty'&&empty){
  const task=tasks.find(t=>t[0]===active);
  screen.innerHTML=pageHead(`EMPTY / ${task[1]}`,task[1],task[2])+`<div class="empty-box"><div class="ic">✦</div><p><strong>${empty[0]}</strong>——${empty[1]}</p><div class="actions">${demo('创建示例工作区','outline')}${btn('回到总览','overview')}</div></div>`;
 }else{
  screen.innerHTML=views[active]();
 }
 nav.innerHTML=(()=>{const planned=tasks.filter(t=>t[3]===1),normal=tasks.filter(t=>t[3]===0);
  const item=([id,title,,p],i)=>`<button data-view="${id}" ${id===active?'aria-current="page"':''}><span>${String(i+1).padStart(2,'0')}</span>${title}${p?' ⌗':''}</button>`;
  return `<div class="group">已实现</div>${normal.map((t,i)=>item(t,i)).join('')}<div class="group">规划中</div>${planned.map((t,i)=>item(t,normal.length+i)).join('')}`;})();
 document.querySelectorAll('.app-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===(tabFor[active]||'overview')));
 const task=tasks.find(t=>t[0]===active);
 document.getElementById('caption').textContent=`T${String(tasks.indexOf(task)+1).padStart(2,'0')} · ${task[1]} / ${task[2]}${task[3]?'（规划）':''}`;
 setState();
}
function setState(){
 const old=document.getElementById('scenario');if(old)old.remove();
 const v=stateVal;if(v==='ready'||v==='empty')return;
 const messages={loading:['正在读取任务样例','占位只用于首次无数据；刷新应保留旧结果。'],partial:['部分成功','已确认、明确失败、未执行与待核对分别报告，不重做成功项。'],failure:['未能完成当前步骤','已有内容与返回点保留，可以回原任务或手工继续。'],unknown:['提交结果待核对','没有证据前不重放写入，不把未知显示为零或已完成。']};
 const el=document.createElement('div');el.id='scenario';el.className='notice '+(v==='loading'?'':'warn');el.setAttribute('role','status');
 el.innerHTML=`<strong>${messages[v][0]}</strong> · ${messages[v][1]}${v==='loading'?`<div class="skeleton" style="height:10px;margin-top:8px"></div><div class="skeleton" style="height:10px;margin-top:6px;width:70%"></div>`:''}`;
 screen.prepend(el);
}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3200);}
document.addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button)return;
 if(button.dataset.view){active=button.dataset.view;answer=false;stateVal='ready';document.getElementById('state').value='ready';render();screen.focus({preventScroll:true});return;}
 if(button.hasAttribute('data-reveal')){answer=true;render();return;}
 if(button.dataset.rate){toast(`已展示「${button.textContent.trim()}」操作样例；不提交正式评分。`);return;}
 if(button.dataset.demo)toast(`「${button.dataset.demo}」是固定操作样例，不保存内容或调用模型。`);
});
document.addEventListener('keydown',event=>{
 if(event.code==='Space'&&active==='review'&&!answer&&!['INPUT','TEXTAREA','SELECT','BUTTON'].includes(event.target.tagName)){event.preventDefault();answer=true;render();}
});
document.getElementById('theme-toggle').addEventListener('click',function(){const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';this.setAttribute('aria-pressed',String(dark));this.textContent=dark?'浅色主题':'深色主题';});
document.getElementById('width-toggle').addEventListener('click',function(){const narrow=document.getElementById('app').classList.toggle('mobile');document.getElementById('app').style.maxWidth=narrow?'390px':'';this.setAttribute('aria-pressed',String(narrow));this.textContent=narrow?'桌面宽度':'窄屏 390px';});
document.getElementById('state').addEventListener('change',function(){stateVal=this.value;render();});
render();
</script>
</body>
</html>
