function render(){screen.innerHTML=views[active]();nav.innerHTML=tasks.map(([id,title],i)=>`<button data-view="${id}" ${id===active?'aria-current="page"':''}><span>${String(i+1).padStart(2,'0')}</span>${title}</button>`).join('');document.querySelectorAll('.app-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===(active==='object'?'object':active==='plan'?'plan':'today')));const task=tasks.find(t=>t[0]===active);document.getElementById('caption').textContent=`T${String(tasks.indexOf(task)+1).padStart(2,'0')} · ${task[1]} / ${task[2]}`;setState();}
function setState(){const old=document.getElementById('scenario');if(old)old.remove();const value=document.getElementById('state').value;if(value==='ready')return;const messages={loading:['正在读取任务样例','占位只用于首次无数据；刷新应保留旧结果。'],partial:['部分成功','已确认、明确失败、未执行与待核对分别报告，不重做成功项。'],failure:['未能完成当前步骤','已有内容与返回点保留，可以回原任务或手工继续。'],unknown:['提交结果待核对','没有证据前不重放写入，不把未知显示为零或已完成。']};const el=document.createElement('div');el.id='scenario';el.className='notice '+(value==='loading'?'':'warn');el.setAttribute('role','status');el.innerHTML=`<strong>${messages[value][0]}</strong><br>${messages[value][1]}`;screen.prepend(el);}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3500);}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.view){active=button.dataset.view;answer=false;face='edit';document.getElementById('state').value='ready';render();screen.focus({preventScroll:true});return;}if(button.hasAttribute('data-reveal')){answer=true;render();screen.querySelector('.rating button').focus({preventScroll:true});return;}if(button.dataset.face){face=button.dataset.face;render();return;}if(button.dataset.rate){toast(`已展示“${button.textContent.trim()}”操作样例；不提交正式评分。`);return;}if(button.dataset.demo)toast(`“${button.dataset.demo}”是固定操作样例，不保存内容或调用模型。`);});
document.getElementById('theme-toggle').addEventListener('click',function(){const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';this.setAttribute('aria-pressed',String(dark));this.textContent=dark?'浅色主题':'深色主题';});
document.getElementById('width-toggle').addEventListener('click',function(){const narrow=document.getElementById('app').classList.toggle('mobile');this.setAttribute('aria-pressed',String(narrow));this.textContent=narrow?'桌面宽度':'窄屏 390px';});
document.getElementById('state').addEventListener('change',setState);
document.addEventListener('keydown',event=>{if(event.code==='Space'&&active==='review'&&!answer&&!["INPUT","TEXTAREA","SELECT","BUTTON"].includes(event.target.tagName)){event.preventDefault();answer=true;render();}});
render();
</script>
</body>
</html>
