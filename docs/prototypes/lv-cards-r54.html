function submitRescheduleDemo(retry=false){
 if(ui.rescheduleBusy)return;
 const card=ui.session[ui.index],days=Number(ui.rescheduleDays);
 if(!card||!Number.isSafeInteger(days)||days<1||days>36500)return;
 if(!retry||!ui.rescheduleTarget)ui.rescheduleTarget=Date.now()+days*86400000;
 const target=ui.rescheduleTarget,cardID=card.id;
 ui.rescheduleBusy=true;ui.rescheduleError='';render();
 setTimeout(()=>{
  if(!retry&&ui.rescheduleFailFirst){
   ui.rescheduleBusy=false;ui.rescheduleRetryReady=true;
   ui.rescheduleError=`写入失败，样例卡片未更改；当前仍停留在第 ${ui.index+1} 张。重试将继续使用 ${rescheduleTargetLabel(target)} 这个到期目标。`;
   render();return;
  }
  const current=ui.session[ui.index];
  if(!current||current.id!==cardID)return;
  if(!ui.tutorial){const saved=store.cards.find(item=>item.id===cardID);if(saved&&saved.due){saved.due=false;saved.nextDue=rescheduleTargetLabel(target);store.due=Math.max(0,store.due-1);}}
  ui.rescheduleBusy=false;ui.rescheduleOpen=false;ui.rescheduleRetryReady=false;ui.rescheduleTarget=null;ui.rescheduleError='';
  ui.index++;ui.answer=false;ui.choice='';ui.choiceFeedback='';refreshChoiceOptions();
  if(ui.index>=ui.session.length)setPage('results');else render();
  notify(`改期已保存至 ${rescheduleTargetLabel(target)}；本场已推进到下一张。`);
 },700);
}

let tabPanelSeq=0;
function wireTabPanels(root){
 for(const list of root.querySelectorAll('[role="tablist"]')){
  const label=list.getAttribute('aria-label')||'';
  let panel=label==='卡片筛选'?document.getElementById('library-rows'):null;
  if(!panel){
   const anchor=label==='制卡方式'?list.parentElement:list;
   if(!anchor?.parentElement||!anchor.nextSibling)continue;
   panel=document.createElement('div');panel.id=`lv-r54-tabpanel-${++tabPanelSeq}`;
   let node=anchor.nextSibling;while(node){const next=node.nextSibling;panel.append(node);node=next;}
   anchor.after(panel);
  }
  const tabs=[...list.querySelectorAll('[role="tab"]')];
  if(!tabs.length)continue;
  tabs.forEach((tab,index)=>{tab.id=`lv-r54-tab-${panel.id}-${index}`;tab.setAttribute('aria-controls',panel.id);});
  const active=tabs.find(tab=>tab.getAttribute('aria-selected')==='true')||tabs[0];
  panel.setAttribute('role','tabpanel');panel.setAttribute('tabindex','0');panel.setAttribute('aria-labelledby',active.id);
 }
}

function studio(){const ai=ui.studioMode==='ai';const missing=!store.aiConfigured||ui.scene==='aiMissing';return pageHead('制卡工作台','把一段理解，变成一张好卡。','先选内容与题型，卡面同步预览；AI 候选只有审核后才会创建。',tag(ui.generating?'生成中 · 可取消':'草稿已保留',ui.generating?'warm':''))+`<div class="studio-top"><div class="subtabs" role="tablist" aria-label="制卡方式"><button role="tab" data-action="studio-mode" data-mode="manual" aria-selected="${!ai}">手工制卡</button><button role="tab" data-action="studio-mode" data-mode="ai" aria-selected="${ai}">${ico('spark')} AI 辅助</button></div><div class="flex"><span class="small-copy">保存到</span><select id="draft-deck" aria-label="保存到卡组">${['网络基础','日常英语','经济学笔记'].map(d=>`<option ${ui.draftDeck===d?'selected':''}>${d}</option>`).join('')}</select>${tag('来源保留')}</div></div>${ai&&missing?`<div class="notice warm" style="margin-bottom:18px"><strong>AI 还没有配置。可以先手工制卡。</strong><p>在设置中选择思源内置 AI 或自定义服务商，并完成模型配置。生成前会再次展示实际材料和外发范围。</p><div class="actions">${navBtn('查看 AI 设置','settings','small')}${btn('继续手工制卡','manual','small ghost')}</div></div>`:''}${ai&&['ai401','aiQuota'].includes(ui.scene)?`<div class="notice red" style="margin-bottom:18px"><strong>${ui.scene==='ai401'?'服务商未通过认证（401）':'服务商配额不足'}</strong><p>${ui.scene==='ai401'?'请检查对应服务商的密钥与模型权限。':'请查看服务商余额或额度，也可切换已有配置。'} 材料和草稿保留，不会自动再次发送。</p><div class="actions">${navBtn('检查配置','settings','small')}${btn('改为手工制卡','manual','small ghost')}</div></div>`:''}<div class="studio-grid"><section class="panel"><div class="section-head"><h3>${ai&&store.candidates.length?'候选审核':ai?'选择材料':'编辑内容'}</h3>${tag(ai&&store.candidates.length?`${store.accepted.size} / ${store.candidates.length} 已接受`:'每张一个知识点')}</div>${ai&&store.candidates.length?store.candidates.map((c,i)=>`<div class="candidate-row ${i===ui.candidate?'active':''}"><button data-action="candidate" data-index="${i}">${i+1}. ${escapeHTML(c.q)}</button><div class="flex between"><small>${store.accepted.has(i)?'已接受，允许创建':'待审核，尚未入库'}</small>${btn(store.accepted.has(i)?'取消接受':'接受','accept','small ghost',`data-index="${i}"`)}</div></div>`).join(''):ai?`<label class="field"><span>当前材料 · 可裁剪</span><textarea id="material" rows="6">${escapeHTML(ui.material)}</textarea><small>来源：计算机网络 / 连接的建立 · 本次仅发送下面预览的片段。</small></label><div class="notice">避免发送密码、令牌、身份证号等敏感内容。你可以删减材料，或使用手工制卡。</div>`:''}${templates()}${!ai||store.candidates.length?`<label class="field"><span>题面</span><textarea id="question" rows="3">${escapeHTML(ui.q)}</textarea></label><label class="field"><span>参考答案</span><textarea id="answer-field" rows="3">${escapeHTML(ui.a)}</textarea></label>${ai&&store.candidates.length?`<p class="small-copy">编辑后需重新接受当前候选，之前的审核不会自动沿用。</p>`:''}`:''}${ai&&!store.candidates.length?`<div class="divider"></div><div class="flex between"><span class="small-copy">每次生成 3 张 · 费用暂未知</span>${btn(ui.generating?'取消生成':ico('shield')+' 预览本次请求',ui.generating?'cancel-ai':'preflight',ui.generating?'':'primary',missing?'disabled aria-describedby="ai-reason"':'')}</div><p id="ai-reason" class="small-copy" style="margin-top:10px">${missing?'完成 AI 配置后才可以生成；手工制卡随时可用。':'确认实际端点、材料与费用信息后，再开始生成。'}</p>`:''}</section><div class="stack"><section class="panel"><div class="section-head"><h3>实际卡面预览</h3>${tag('随编辑变化','purple')}</div><div id="live-preview">${preview()}</div><div class="flex between" style="margin-top:15px"><span class="small-copy">卡组：<span id="preview-deck">${escapeHTML(ui.draftDeck)}</span></span>${btn(ui.previewAnswer?'只看题面':'查看答案','preview-answer','small ghost')}</div></section><section class="panel"><div class="section-head"><h4>为什么这样出题？</h4>${ico('book')}</div><p class="small-copy">好题面给清楚的范围，让你主动回忆一个知识点。</p><div class="source-doc" style="margin-top:12px"><strong>来源依据</strong><br>${escapeHTML(ui.material)}</div>${btn('查看完整来源','source','text')}</section></div></div><footer class="studio-footer"><span class="small-copy" id="save-reason">${ai?'选择不等于已审核，只有“已接受”候选可创建。':'题面与答案完整后可以保存；高级字段可随后补充。'}</span><div class="actions">${navBtn('返回今日','today','ghost')}${btn(ai?`创建已接受 ${store.accepted.size} 张`:'创建这张闪卡',ai?'create-candidates':'save-card','primary',ai?(!store.accepted.size?'disabled aria-describedby="save-reason"':''):(!ui.q.trim()||!ui.a.trim()?'disabled aria-describedby="save-reason"':''))}</div></footer>`;}
function reviewCards(){const now=Date.now();const shortIds=store.shortTerm.filter(x=>x.requeueAtMs&&x.requeueAtMs<=now).map(x=>x.id);const due=store.cards.filter(c=>(c.due||shortIds.includes(c.id))&&(ui.deck==='全部卡组'||c.deck===ui.deck));return [...new Map(due.map(c=>[c.id,c])).values()].slice(0,3);}
function buildChoiceOptions(answer,candidates){const normalized=String(answer||'').trim();if(!normalized)return null;const seen=new Set([normalized]);const options=[normalized];for(const candidate of candidates){const value=String(candidate||'').trim();if(!value||seen.has(value))continue;seen.add(value);options.push(value);if(options.length===4)break;}return options.length>1?options:null;}
function refreshChoiceOptions(){const card=ui.session[ui.index];ui.choiceOptions=null;ui.choiceFeedback='';if(ui.mode!=='choice'||!card)return;if(ui.tutorial&&ui.tutorialType==='选择卡'){ui.choiceOptions=[card.a,'反复看答案，不尝试回忆','同时背很多无关概念'];return;}ui.choiceOptions=buildChoiceOptions(card.a,ui.session.slice(ui.index+1,ui.index+8).map(item=>item.a));}
function startSession(tutorial=false){if(!tutorial&&ui.session.length&&ui.index<ui.session.length){modal('继续当前会话？',`<p>当前会话已完成 ${ui.index} 张，继续会保留本场范围与进度。</p><div class="actions">${btn('继续当前会话','continue-review','primary')}${btn('放弃并重新开始','restart-review','ghost')}</div>`);return;}ui.session=structuredClone(tutorial?[{id:'sample',q:ui.tutorialType==='挖空卡'?'机会成本是选择一种方案时，放弃的最佳替代方案的价值。':ui.tutorialType==='选择卡'?'哪种做法更适合主动回忆？':'为什么回忆之后，再看答案？',a:ui.tutorialType==='挖空卡'?'放弃的最佳替代方案':ui.tutorialType==='选择卡'?'先尝试自己回答，再揭晓并核对。':'回忆让你发现真正记住了什么；对照答案可以纠正遗漏与误解。',deck:'示例体验',type:ui.tutorialType==='选择卡'?'问答卡':ui.tutorialType,source:'内置公开教学样例'}]:reviewCards());if(!ui.session.length&&!tutorial){notify('这个范围没有到期卡片，可换卡组或练习示例。');return;}ui.index=0;ui.answer=false;ui.choice='';ui.tutorial=tutorial;ui.practice=0;ui.sessionRatings=[];ui.mode=tutorial&&ui.tutorialType==='选择卡'?'choice':ui.defaultMode;refreshChoiceOptions();setPage('review');}
function review(){if(!ui.session.length){return pageHead('专注复习','先确认这一场的范围。','正式复习与示例练习分别记录。')+`<section class="panel empty">${tile('cards')}<h3>还没有开始会话</h3><p>从今日进入正式复习，或先试内置示例。</p><div class="actions">${btn('开始本场复习','start-review','primary')}${navBtn('体验示例','onboarding')}</div></section>`;}const c=ui.session[ui.index];if(!c)return results();const shownQ=c.type==='挖空卡'?escapeHTML(c.q).replace('放弃的最佳替代方案','<span class="cloze">［ 回忆这里 ］</span>'):escapeHTML(c.q);const unknown=ui.scene==='unknown';const canChoice=ui.mode==='choice'&&Array.isArray(ui.choiceOptions)&&ui.choiceOptions.length>=2;return `<div class="review-top">${btn(ico('back')+' 暂停并返回','pause-review','ghost')}<div class="session-info">${tag(ui.tutorial?'示例练习 · 独立记录':'正式复习','purple')}<span>${escapeHTML(c.deck)}</span><span class="num">${ui.index+1} / ${ui.session.length}</span>${tag(`${ui.time} 分钟预算`)}</div>${btn('本场偏好','session-options','ghost')}</div><div class="progress session-progress"><i style="width:${ui.index/ui.session.length*100}%"></i></div>${unknown?`<div class="notice warm" style="margin-bottom:20px"><strong>评分结果还在核对中</strong><p>暂时锁定重复评分。确认上一笔是否成功后再继续，当前卡片与进度已保留。</p>${btn('核对上一笔评分','reconcile','small')}</div>`:''}<section class="study-face"><div class="flex between"><span class="eyebrow">${ui.answer?'回忆之后 · 对照答案':'现在，试着想起来'}</span>${tag(escapeHTML(c.type))}</div><h2>${shownQ}</h2><div class="study-source">来源：${escapeHTML(c.source)} ${btn('查看','source','text')}</div>${!canChoice&&ui.mode==='choice'&&!ui.answer?`<div class="notice warm" style="margin-top:18px"><strong>本题没有可信干扰项，已回到自由回忆。</strong><p>先自己回答，再揭晓答案；不会加入占位选项。</p></div>`:''}${canChoice&&!ui.answer?`<div class="choice-list">${ui.choiceOptions.map((s,i)=>`<button data-action="choose" data-choice="${i}" aria-pressed="${ui.choice===String(i)}">${String.fromCharCode(65+i)}　${escapeHTML(s)}</button>`).join('')}</div><p class="small-copy" style="margin-top:10px">选项仅在当前复习中即时构造；干扰项不足时自动减少选项，无法形成有效选项时回到自由回忆。</p>`:''}${ui.answer?`<div class="study-answer"><span class="eyebrow">参考答案</span><p style="margin-top:10px">${escapeHTML(c.a)}</p>${ui.choiceFeedback?`<div class="notice warm" style="margin-top:12px">${ui.choiceFeedback}</div>`:''}<div class="notice" style="margin-top:19px">${ui.tutorial?'这是独立示例。下面的评分用于体验，不进入正式复习统计。':'先对照自己的回答，再由你选择记忆情况。选择题选对不等于完全掌握。'}</div></div>`:''}</section><div class="study-bottom">${!ui.answer?`${btn('显示答案 <kbd>Space</kbd>','reveal','primary large',unknown?'disabled':'')}<p class="small-copy" style="margin-top:11px">不确定也没关系，先给自己一点回忆的时间。</p>`:`<p class="small-copy">这次，你记得怎样？</p><div class="rating">${[['遗忘','约 3 分钟后回到短期循环'],['困难','间隔由思源计算'],['良好','间隔由思源计算'],['简单','间隔由思源计算']].map(([l,h],i)=>btn(`${l} <kbd>${i+1}</kbd><small>${h}</small>`,'rate','',`data-rate="${i+1}" ${unknown?'disabled':''}`)).join('')}</div><p class="small-copy">${ui.tutorial?'体验完成后，可选择创建自己的闪卡。':'正式调度由思源处理；短期循环不冒充新的到期结果。'}</p>`}</div><div class="review-tools">${btn('先跳过','skip','ghost',unknown?'disabled':'')}${btn('对这张卡有疑问','mark-issue','ghost',unknown?'disabled':'')}${btn('提前收工','finish','ghost',unknown?'disabled':'')}</div>`;}
function results(){const entries=ui.tutorial?[]:ui.sessionRatings;const missed=entries.filter(e=>e.rating===1).length;return pageHead('本场结果',ui.tutorial?'第一张示例，已经体验过了。':'这次就学到这里。',ui.tutorial?'现在你已经知道如何回忆、翻面、评分。':'完成多少，就记录多少。你可以休息，也可以选择下一步。')+`<section class="panel result-panel"><div class="result-mark">${ico('check')}</div><h2>${ui.tutorial?'从理解操作，到自己的卡片。':'给记忆一点时间。'}</h2><p>${ui.tutorial?'示例练习与正式学习分别记录，没有改变你的到期卡片。':'当前样例评分已同步到今日、卡库和学习记录。'}</p><div class="result-stats"><div><strong>${ui.tutorial?ui.practice:entries.length}</strong><small>${ui.tutorial?'已体验':'已评分'}</small></div><div><strong>${ui.tutorial?'—':missed}</strong><small>遗忘卡</small></div><div><strong>${ui.tutorial?'独立':ui.time+' 分钟'}</strong><small>${ui.tutorial?'练习记录':'本场预算'}</small></div></div><div class="notice ${missed?'warm':'green'}"><strong>${ui.tutorial?'下一步，做一张属于你的卡。':missed?'遗忘卡会进入短期循环。':'这一场的结果已保留。'}</strong><p>${ui.tutorial?'可以沿用示例题型，边编辑边看卡面。':missed?'回到循环时仍需你翻面与评分；也可以先修题面，不要求现在继续。':'正式复习仍按思源下次到期安排；主动收工不会伪造剩余卡片的完成状态。'}</p></div><div class="actions">${navBtn(ui.tutorial?'创建自己的闪卡':'返回今日',''+(ui.tutorial?'studio':'today'),'primary large')}${navBtn(ui.tutorial?'再看其他示例':'查看学习记录',ui.tutorial?'onboarding':'learning')}</div></section>`;}
function learning(){const tabs=[['recap','学习回顾'],['plans','目标与计划'],['calendar','学习日历']];return pageHead('学习与回顾','看见进展，安排下一步。','正式复习、示例体验与学习计划分别呈现，不把次数当作掌握程度。',ui.learningTab==='plans'?btn(ico('plus')+' 新建目标','new-plan','primary'):btn(ico('doc')+' 记录口径','stats-info','ghost'))+`<div class="subtabs" role="tablist" aria-label="学习分面" style="margin-bottom:22px">${tabs.map(([id,l])=>`<button role="tab" aria-selected="${ui.learningTab===id}" data-action="learn-tab" data-tab="${id}">${l}</button>`).join('')}</div>${ui.learningTab==='plans'?`<div class="two-col"><section class="panel"><div class="flex between"><h3>解释清楚网络连接</h3>${tag('进行中','purple')}</div><p class="small-copy" style="margin:10px 0 22px">范围：网络基础 · 每次 5 分钟 · 不要求每天连续</p><div class="step-list">${[['了解必要概念','材料：连接的建立，已收集。'],['主动回忆','本周已有 16 张正式复习样例记录。'],['解释与应用','目前没有应用证据，不用复习次数推断。']].map(([t,d],i)=>`<div class="step"><b>${i+1}</b><div><h4>${t}</h4><p>${d}</p></div></div>`).join('')}</div><div class="actions" style="margin-top:23px">${btn('复习这个范围','goal-review','primary')}${btn('调整计划','new-plan','ghost')}</div></section><section class="panel"><h3>考试与低频工具</h3><p class="small-copy" style="margin-top:8px">不与日常复习争抢一级入口，按需要展开。</p><div class="row">${tile('clock','warm')}<div class="grow"><strong>考试冲刺计划</strong><p>确定范围与截止日期，再核对每天投入。</p></div>${btn('查看','exam-plan','small')}</div><div class="notice">目标用于组织学习任务；考试日期不会直接覆盖思源已有调度。</div></section></div>`:ui.learningTab==='calendar'?`<div class="two-col"><section class="panel"><div class="section-head"><h3>2026 年 10 月</h3>${tag('过去：已评分 / 未来：预测')}</div><div class="calendar">${['一','二','三','四','五','六','日'].map(d=>`<span class="weekday">${d}</span>`).join('')}${'<span></span>'.repeat(3)}${Array.from({length:31},(_,i)=>i+1).map(n=>`<button data-action="day" data-day="${n}" class="${[5,6,7,8,11].includes(n)?'heat':''} ${n===11?'today':''}" aria-pressed="${ui.day===n}" aria-label="10 月 ${n} 日 ${n<12?'已评分':'到期预测'}">${n}</button>`).join('')}</div></section><section class="panel"><h3 id="day-title">10 月 ${ui.day} 日</h3><p id="day-info" class="small-copy" style="margin:10px 0 20px">${ui.day<=11?'显示本日正式评分记录；样例练习单独计算。':'未来负载为预测，可能随评分与内容变化。'}</p><div class="notice">日历用于查看与核对。修改日期不会改变任何卡片的调度。</div>${btn('查看本日范围','day-scope','text')}</section></div>`:`<div class="two-col"><section class="panel"><div class="section-head"><div><h3>近 7 天复习量</h3><p class="small-copy">正式评分记录 · 不包含示例练习</p></div>${tag('样例数据')}</div><div class="flex" style="margin-top:20px;gap:26px"><div><strong class="num" style="font-size:28px">${44+store.log.length}</strong><p class="small-copy">评分次数</p></div><div><strong class="num" style="font-size:28px">4</strong><p class="small-copy">有学习记录的天数</p></div></div><svg class="chart" viewBox="0 0 450 150" role="img" aria-label="合成样例：周一 6 次、周二 10 次、周三 8 次、周四 12 次、周五与周六 0 次、周日 8 次"><path d="M25 28h405M25 73h405M25 118h405" stroke="var(--lv-border)" stroke-dasharray="3 5"/><path d="M30 79L96 53 162 65 228 40 294 118 360 118 426 65L426 118H30Z" fill="var(--lv-primary-soft)"/><path d="M30 79L96 53 162 65 228 40 294 118 360 118 426 65" fill="none" stroke="var(--lv-color-brand)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${[30,96,162,228,294,360,426].map((x,i)=>`<text x="${x}" y="145" text-anchor="middle">周${['一','二','三','四','五','六','日'][i]}</text>`).join('')}</svg><p class="small-copy">次数描述投入，不能单独证明记得住或用得上。</p></section><section class="panel"><div class="section-head"><h3>本场学习记录</h3>${tag(`${store.log.length} 条`)}</div>${store.log.length?store.log.slice().reverse().map(e=>`<div class="row">${tile('check','green')}<div class="grow"><strong>${escapeHTML(e.q)}</strong><p>${escapeHTML(e.deck)} · ${['','遗忘','困难','良好','简单'][e.rating]} · 本场样例记录</p></div></div>`).join(''):`<div class="empty" style="padding:35px 5px">${tile('learn')}<h4>本场还没有正式评分</h4><p>完成一次复习后，会显示题面、范围与评分。</p>${navBtn('回到今日','today','text')}</div>`}</section></div><div class="guide-inline">${tile('leaf','green')}<div class="grow"><h4>下一步，围绕一个清楚的目标学习</h4><p>把材料、卡组和可承担的时 function aiSetup(){modal('AI 配置与使用说明',`<div class="step-list">${[['选择一种接入方式','思源内置 AI：先到思源设置完成模型配置；自定义服务商：在插件内填写端点、模型和密钥。'],['检查模型与预算','确认模型可用、账户权限与额度。单价未知时，不展示虚假的费用。'],['每次请求前核对','看实际材料、端点和费用估算；敏感内容可以删减或拒绝发送。']].map(([t,d],i)=>`<div class="step"><b>${i+1}</b><div><h4>${t}</h4><p>${d}</p></div></div>`).join('')}</div><div class="notice" style="margin-top:21px">当前是原型，只提供“已配置”样例开关。不读取、不填写、不保存任何真实凭据。</div><div class="actions">${btn('继续手工制卡','setup-manual')}${btn('演练已配置场景','setup-demo','primary')}</div>`);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.id==='theme'){ui.theme=ui.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=ui.theme;render();return;}if(b.id==='reset'){location.href=location.pathname;return;}if(b.dataset.page){if(dialog.open)dialog.close();setPage(b.dataset.page);return;}const a=b.dataset.action;switch(a){
case 'retry':ui.scene='ready';render();notify('样例状态已核对，当前范围保留。');break;
case 'source-retry':ui.scene='ready';render();notify('来源打开成功，仍停留在原任务现场。');break;
case 'start-review':startSession();break;
case 'continue-review':if(ui.session.length&&ui.index<ui.session.length){ui.tutorial=false;ui.answer=false;ui.choice='';setPage('review');}else startSession();break;
case 'restart-review':dialog.close();ui.session=[];ui.index=0;startSession();break;

case 'finish':if(ui.scene==='unknown'){notify('结果待核对，不能提前结束本场。');break;}setPage('results');break;

case 'apply-options':ui.mode=document.getElementById('session-mode').value;dialog.close();render();break;
case 'mark-issue':if(ui.scene==='unknown'){notify('结果待核对，暂不修改卡片状态。');break;}{const c=ui.session[ui.index];const real=c&&store.cards.find(x=>x.id===c.id);if(c)c.issue=true;if(real)real.issue=true;render();notify('疑问已保留到待修列表；可以先完成复习再修卡。');}break;

case 'save-edit':{const q=document.getElementById('edit-q').value.trim(),a=document.getElementById('edit-a').value.trim();if(!q||!a){notify('题面和答案都需要填写。');break;}const c=store.cards.find(c=>c.id===ui.currentID);c.q=q;c.a=a;dialog.close();render();notify('修改已同步到当前卡库，来源关联保留。');break;}
case 'delete-one':store.selected=new Set([ui.currentID]);
case 'delete-preview':modal('核对移除范围',`<div class="notice warm"><strong>将从本页合成卡库移除 ${store.selected.size} 张卡</strong><p>不会删除思源源文档。原型刷新可恢复所有样例。</p></div><p class="small-copy" style="margin-top:16px">实际实现应核对集合成员与影响，成功后再更新列表和数量。</p><div class="actions">${btn('保留卡片','close-dialog')}${btn('确认移除样例','delete-confirm','danger')}</div>`);break;
case 'delete-confirm':{const removed=store.cards.filter(c=>store.selected.has(c.id));store.cards=store.cards.filter(c=>!store.selected.has(c.id));store.due=Math.max(0,store.due-removed.filter(c=>c.due).length);store.selected.clear();dialog.close();render();notify('样例移除完成，其他卡片保留。');}break;

case 'new-plan':modal('调整学习目标',`<label class="field">目标<input value="能够解释网络连接的建立"></label><label class="field">范围<select><option>网络基础</option></select></label><label class="field">每次时间<select><option>5 分钟</option><option>10 分钟</option></select></label><div class="notice">这是目标编辑样例，不覆盖思源调度。应用证据与记忆记录分别登记。</div><div class="actions">${btn('取消','close-dialog')}${btn('确认样例方案','plan-confirm','primary')}</div>`);break;
case 'plan-confirm':dialog.close();notify('目标编辑流程已演练；原型未接持久化目标模型。');break;

case 'toggle-ai':store.aiConfigured=!store.aiConfigured;render();break;
case 'theme':ui.theme=ui.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=ui.theme;render();break;
case 'privacy':modal('外发与取消说明',`<div class="step-list"><div><h4>发送由你发起</h4><p class="small-copy">只发送本次选中的材料与参数。生成前可读、可删减、可拒绝。</p></div><div><h4>失败不丢草稿</h4><p class="small-copy">取消、超时、认证失败、限流和配额不足分别解释；不会自动再次外发。</p></div><div><h4>取消的边界</h4><p class="small-copy">取消后不接受迟到结果；如果请求已到达服务商，可能仍按服务商规则计费。</p></div></div><div class="actions">${btn('已了解','close-dialog','primary')}</div>`);break;
case 'stats-info':modal('学习数据口径',`<p>正式评分以思源确认结果为准。示例体验、纯练习和跳过分别记录。</p><div class="notice" style="margin-top:17px">未知不显示为零；评分次数不是掌握率。图表是明确标注的固定合成样例。</div><div class="actions">${btn('返回回顾','close-dialog','primary')}</div>`);break;
case 'data-tools':modal('数据工作区',`<div class="row"><div class="grow"><strong>导出与备份</strong><p>保留当前插件已实现能力，重构只调整承载位置。</p></div>${tag('需接现有接口')}</div><div class="row"><div class="grow"><strong>Anki / 文本导入</strong><p>预览映射 → 导入 → 逐项结果与损失说明。</p></div>${tag('迁移入口')}</div><div class="notice warm">恢复是写入操作，先展示备份日期、范围与替换影响，不能只有一个“成功”提示。</div><div class="actions">${btn('返回设置','close-dialog','primary')}</div>`);break;
case 'diagnostics':modal('诊断与能力状态',`<div class="row"><strong>本地制卡与复习</strong>${tag('独立可用','green')}</div><div class="row"><strong>AI 辅助</strong>${tag(store.aiConfigured?'配置样例可用':'缺少配置','warm')}</div><div class="row"><strong>OCR 材料采集</strong>${tag('等待稳定版接口')}</div><div class="notice">OCR 不作为本轮重构前置。按已记录约定，等待思源 3.8.7 正式版再评估。</div><div class="actions">${btn('返回设置','close-dialog','primary')}</div>`);break;
case 'import-repair':ui.studioMode='manual';setPage('studio');notify('进入补充内容工作面；成功项不会重新导入。');break;
case 'palette':modal('查找卡片与功能',`<label class="search-field" style="width:100%">${ico('search')}<input id="palette-search" type="search" placeholder="输入“制卡”“复习”“设置”…" aria-label="搜索功能"></label><div id="palette-items" style="margin-top:16px">${pages.map(([id,l])=>`<div class="palette-row" data-name="${l}">${navBtn(l,id,'ghost')}</div>`).join('')}</div><p class="small-copy" style="margin-top:15px">Escape 关闭；返回时保留原工作面。</p>`);dialog.querySelector('input').focus();break;
case 'close-dialog':dialog.close();break;
}});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='face'){ui.page=e.target.value;ui.scene='ready';location.hash=ui.page;render();}if(id==='width'){ui.viewport=e.target.value;const u=new URL(location.href);if(ui.viewport==='fluid')u.searchParams.delete('width');else u.searchParams.set('width',ui.viewport);history.replaceState(null,'',u);render();}if(id==='scene'){ui.scene=e.target.value;if(ui.scene.startsWith('ai')){ui.page='studio';ui.studioMode='ai';}render();}if(id==='time')ui.time=e.target.value;if(id==='deck-filter'){ui.deck=e.target.value;render();}if(id==='draft-deck'){ui.draftDeck=e.target.value;document.getElementById('preview-deck').textContent=ui.draftDeck;}if(id==='consent')dialog.querySelector('[data-action="generate-ai"]').disabled=!e.target.checked;if(e.target.dataset.select){e.target.checked?store.selected.add(e.target.dataset.select):store.selected.delete(e.target.dataset.select);document.getElementById('batch-slot').innerHTML=batchBar();e.target.closest('.card-row').classList.toggle('selected',e.target.checked);}if(id==='default-mode'){ui.defaultMode=e.target.value;notify('本页默认方式已变化；下一场正式复习会沿用这个样例设置。');}});
document.addEventListener('input',e=>{const id=e.target.id;if(id==='card-search'){ui.query=e.target.value;document.getElementById('library-rows').innerHTML=libraryRows();document.getElementById('library-count').textContent=`当前样例 ${filteredCards().length} 张 · 搜索范围：本页合成卡库`;}if(['question','answer-field','material'].includes(id)){if(id==='question')ui.q=e.target.value;if(id==='answer-field')ui.a=e.target.value;if(id==='material')ui.material=e.target.value;if(store.candidates.length&&id!=='material'){store.candidates[ui.candidate]={q:ui.q,a:ui.a};store.accepted.delete(ui.candidate);const create=main.querySelector('[data-action="create-candidates"]');if(create){create.disabled=!store.accepted.size;create.textContent=`创建已接受 ${store.accepted.size} 张`;}const current=main.querySelector('.candidate-row.active small');if(current)current.textContent='已编辑，需重新接受';}const p=document.getElementById('live-preview');if(p)p.innerHTML=preview();const save=main.querySelector('[data-action="save-card"]');if(save)save.disabled=!ui.q.trim()||!ui.a.trim();}if(id==='palette-search')dialog.querySelectorAll('.palette-row').forEach(row=>row.hidden=!row.dataset.name.includes(e.target.value.trim()));});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.querySelector('[data-action="palette"]').click();return;}if(dialog.open||e.target.closest('input,textarea,select,[contenteditable]'))return;if(ui.page==='review'){if(e.code==='Space'&&!ui.answer){e.preventDefault();ui.answer=true;render();}if(ui.answer&&['1','2','3','4'].includes(e.key)){e.preventDefault();rate(Number(e.key));}}if(ui.page==='library'&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const rows=[...main.querySelectorAll('.card-open')];if(!rows.length)return;let i=rows.indexOf(document.activeElement);i=e.key==='ArrowDown'?Math.min(rows.length-1,i+1):Math.max(0,i-1);rows[i].focus();}});

 if(ui.rescheduleBusy){

 }

<script>
// The fixture state persists across navigation. Only the matching recovery action clears it.
(() => {
    const blockedReviewScenes = new Set(['unknown', 'duePartial', 'error', 'loading']);
    const aiScenes = new Set(['ai401', 'aiQuota', 'aiTimeout', 'aiRateLimit', 'aiServer', 'aiNetwork', 'aiBudget', 'aiSensitive', 'aiStale', 'aiWriteUnknown']);
    if (ui.scene === 'aiMissing' || aiScenes.has(ui.scene)) {
        store.aiConfigured = aiScenes.has(ui.scene);
    }
    // Scene query parameters are also used as deep-link fixtures. Resolve the
    // destination before the first render so a copied URL opens the same
    // surface as choosing that scene from the review controls.
    if (ui.scene === 'sourceFailed') {
        // This fixture only renders on the recovery surface; make a copied
        // state URL land there directly instead of silently showing Today.
        ui.page = 'recovery';
        location.hash = 'recovery';
    } else if (ui.scene === 'aiWriteUnknown') {
        ui.page = 'recovery';
        location.hash = 'recovery';
    } else if (ui.scene === 'aiMissing' || aiScenes.has(ui.scene)) {
        ui.page = 'studio';
        ui.studioMode = 'ai';
        location.hash = 'studio';
    }

    const renderBase = render;
    const issueNoticeBase = issueNotice;
    const filteredCardsBase = filteredCards;
    const deckCardsBase = deckCards;
    const startSessionBase = startSession;

    issueNotice = function () {
        if (ui.scene === 'duePartial') {
            return `<div class="review-issue notice red"><strong>部分卡组暂时无法读取，到期总数未知</strong><p>“经济学笔记”样例读取失败；可用范围仍可查看。为避免少算卡片，本次不缓存合并结果，也不允许启动正式复习。重试完成前，这条提示会在页面间保留。</p><div class="actions">${btn('重试读取', 'retry', 'small')}${btn('查看可用卡组', 'inspect-deck', 'small ghost')}</div></div>`;
        }
        if (ui.scene === 'error') {
            return `<div class="review-issue notice red"><strong>读取失败，保留上次有效内容</strong><p>以下为 10:42 的样例快照。当前到期数可能已经变化，请核对后再开始正式复习。重新读取成功或取消读取状态后，此提示才会清除。</p><div class="actions">${btn('重新读取', 'retry', 'small')}${navBtn('查看待处理', 'recovery', 'small ghost')}</div></div>`;
        }
        if (ui.scene === 'sourceFailed' && ui.page === 'recovery') {
            return `<div class="review-issue notice red"><strong>来源文档暂时无法打开</strong><p>当前任务和卡片现场已保留，可能是文档被移动、删除或权限不足。修复来源后可重试同一个块。</p><div class="actions">${btn('重试打开来源', 'source-retry', 'small')}${btn('查看卡片详情', 'detail', 'small ghost', 'data-id="c5"')}</div></div>`;
        }
        return issueNoticeBase();
    };

    filteredCards = function () {
        const cards = filteredCardsBase();
        return ui.scene === 'duePartial' ? cards.filter(card => card.deck !== '经济学笔记') : cards;
    };

    deckCards = function () {
        const html = deckCardsBase();
        if (ui.scene !== 'duePartial') return html;
        const container = document.createElement('div');
        container.innerHTML = html;
        container.querySelector('[data-deck="经济学笔记"]')?.remove();
        return container.innerHTML;
    };

    startSession = function (tutorial = false) {
        if (!tutorial && blockedReviewScenes.has(ui.scene)) {
            notify('当前到期范围或评分仍在核对，暂不能开始正式复习。');
            return;
        }
        return startSessionBase(tutorial);
    };

    // One wrapper is installed once. Each render replaces the main content before applying state-specific controls.
    render = function () {
        renderBase();
        if (ui.page === 'review') {
            const tools = main.querySelector('.review-tools');
            if (tools) {
                const toggleAction = ui.rescheduleOpen ? 'close-reschedule' : 'open-reschedule';
                tools.insertAdjacentHTML('afterbegin', btn(ui.rescheduleOpen ? '收起改期' : '安排改期', toggleAction, 'ghost', `aria-expanded="${ui.rescheduleOpen}" aria-controls="reschedule-demo"`));
                if (ui.rescheduleOpen && ui.session[ui.index]) {
                    const days = Number(ui.rescheduleDays);
                    const validDays = Number.isSafeInteger(days) && days >= 1 && days <= 36500;
                    const previewTarget = ui.rescheduleTarget || (validDays ? Date.now() + days * 86400000 : null);
                    const retryCopy = ui.rescheduleRetryReady ? `<div class="notice red" role="alert" style="margin-top:14px"><strong>写入没有成功，卡片和本场进度已保留</strong><p>${escapeHTML(ui.rescheduleError)}</p><p>目标时间：<strong>${rescheduleTargetLabel(ui.rescheduleTarget)}</strong></p></div>` : '';
                    const status = ui.rescheduleBusy ? '<p class="small-copy" role="status" aria-live="polite">正在保存改期… 当前卡片与进度保持不变。</p>' : '';
                    const panel = `<section id="reschedule-demo" class="panel" aria-busy="${ui.rescheduleBusy}" aria-labelledby="reschedule-title" style="margin-top:18px"><div class="section-head"><h3 id="reschedule-title">安排改期</h3>${tag('本页演练 · 不写入思源','warm')}</div><p class="small-copy">设置到期天数。提交期间会锁住本场操作，避免重复写入。</p><label class="field" style="max-width:260px">几天后到期<input id="reschedule-days" type="number" min="1" max="36500" step="1" value="${escapeHTML(ui.rescheduleDays)}" ${ui.rescheduleBusy || ui.rescheduleRetryReady ? 'disabled' : ''} aria-invalid="${!validDays}" aria-describedby="reschedule-preview reschedule-range"></label><small id="reschedule-range" class="small-copy">请输入 1 到 36500 之间的整数天数。</small><div class="notice" style="margin-top:12px"><strong>目标到期时间：</strong><output id="reschedule-preview">${rescheduleTargetLabel(previewTarget)}</output><p>失败后重试会沿用这个精确时间，不重新计算。</p></div><label class="flex" style="margin-top:13px;font-size:12px"><input id="reschedule-fail-first" type="checkbox" ${ui.rescheduleFailFirst ? 'checked' : ''} ${ui.rescheduleBusy || ui.rescheduleRetryReady ? 'disabled' : ''}>演练首次写入失败，再重试</label>${retryCopy}${status}<div class="actions" style="margin-top:14px">${btn('取消改期','close-reschedule','ghost',ui.rescheduleBusy ? 'disabled' : '')}${btn(ui.rescheduleBusy ? '正在保存…' : ui.rescheduleRetryReady ? '重试相同目标' : '确认改期','reschedule-submit','primary',ui.rescheduleBusy || !validDays ? 'disabled aria-busy="true"' : '')}</div></section>`;
                    tools.insertAdjacentHTML('beforebegin', panel);
                }
            }
            if (ui.rescheduleBusy || ui.rescheduleRetryReady) {
                for (const button of main.querySelectorAll('button[data-action]')) {
                    if (ui.rescheduleBusy || !['reschedule-submit', 'close-reschedule'].includes(button.dataset.action)) button.disabled = true;
                }
            }
        }
        if (ui.scene === 'loading') {
            const status = main.querySelector('[aria-busy="true"]');
            const copy = status?.querySelector('.small-copy');
            const readAction = main.querySelector('[data-action="retry"]');
            if (copy) copy.textContent = '正在核对当前范围；到期总数未知，正式复习暂不可用。';
            if (readAction) {
                readAction.textContent = '正在读取…';
                readAction.disabled = true;
                readAction.setAttribute('aria-busy', 'true');
                copy?.append(' ', readAction);
            }
            const cancel = document.createElement('button');
            cancel.className = 'text';
            cancel.dataset.action = 'cancel-load';
            cancel.textContent = '取消读取';
            copy?.append(' ', cancel);
        }
        if (ui.scene === 'duePartial' && ui.page === 'library') {
            const failedOption = [...main.querySelectorAll('#deck-filter option')].find(option => option.textContent === '经济学笔记');
            if (failedOption) {
                failedOption.disabled = true;
                failedOption.textContent = '经济学笔记（读取失败）';
            }
        }
        if (blockedReviewScenes.has(ui.scene)) {
            for (const action of ['start-review', 'continue-review']) {
                const button = main.querySelector(`[data-action="${action}"]`);
                if (button) button.disabled = true;
            }
        }
    };

    // Navigation preserves the selected fixture. Choosing a new scene explicitly replaces it.
    document.addEventListener('change', event => {
        const target = event.target;
        if (!(target instanceof HTMLSelectElement)) return;
        if (target.id === 'face') {
            if (ui.rescheduleBusy) {
                event.preventDefault();
                event.stopImmediatePropagation();
                target.value = ui.page;
                notify('改期写入中，请等待结果后再离开本场。');
                return;
            }
            event.preventDefault();
            event.stopImmediatePropagation();
            setPage(target.value);
            return;
        }
        if (target.id === 'scene') {
            event.preventDefault();
            event.stopImmediatePropagation();
            ui.scene = target.value;
            store.aiConfigured = aiScenes.has(target.value);
            if (target.value === 'aiWriteUnknown') {
                ui.page = 'recovery';
                location.hash = 'recovery';
            } else if (target.value.startsWith('ai')) {
                ui.page = 'studio';
                location.hash = 'studio';
                ui.studioMode = 'ai';
            }
            render();
            return;
        }
    }, true);

    // Capture only routes actions whose fixture rules must guard the existing delegated click handler.
    document.addEventListener('click', event => {
        const target = event.target instanceof Element ? event.target : null;
        const routeButton = target?.closest('button[data-page]');
        if (ui.rescheduleBusy && routeButton) {
            event.preventDefault();
            event.stopImmediatePropagation();
            notify('改期写入中，请等待结果后再离开本场。');
            return;
        }
        const button = target?.closest('button[data-action]');
        if (!button) return;
        const action = button.dataset.action;

        if (action === 'recovery-continue') {
            event.preventDefault();
            event.stopImmediatePropagation();
            if (!ui.session.length) ui.session = reviewCards();
            ui.tutorial = false;
            ui.index = Math.min(ui.index, Math.max(0, ui.session.length - 1));
            ui.answer = false;
            ui.choice = '';
            refreshChoiceOptions();
            setPage('review');
            return;
        }
        if (action === 'recovery-ai-review') {
            event.preventDefault();
            event.stopImmediatePropagation();
            ui.studioMode = 'ai';
            if (!store.candidates.length) {
                store.candidates = [{ q: initialCards[0].q, a: initialCards[0].a }, { q: '第二次握手为什么需要返回确认？', a: '让客户端确认服务端能够接收请求，并提供服务端自己的初始序列号。' }];
                store.accepted.clear();
                ui.candidate = 0;
                ui.q = store.candidates[0].q;
                ui.a = store.candidates[0].a;
            }
            setPage('studio');
            notify('已载入候选审核现场；不会重新发送 AI 请求。');
            return;
        }
        if (action === 'recovery-open-deck') {
            event.preventDefault();
            event.stopImmediatePropagation();
            ui.deck = button.dataset.deck || '网络基础';
            ui.filter = 'all';
            setPage('library');
            notify('已打开目标卡组，请先核对已写入卡片；恢复中心不会重复提交。');
            return;
        }
        if (action === 'recovery-open-ai') {
            event.preventDefault();
            event.stopImmediatePropagation();
            ui.studioMode = 'ai';
            setPage('studio');
            notify('已打开 AI 制卡；请重新选择材料，不会自动发送请求。');
            return;
        }
        if (action === 'recovery-open-inbox') {
            event.preventDefault();
            event.stopImmediatePropagation();
            openRecoveryInbox();
            return;
        }
        if (action === 'recovery-open-maintenance') {
            event.preventDefault();
            event.stopImmediatePropagation();
            openRecoveryMaintenance();
            return;
        }
        if (action === 'recovery-use-material') {
            event.preventDefault();
            event.stopImmediatePropagation();
            const materials = [
                '三次握手依次确认客户端发送能力、服务端发送与接收能力，以及客户端的接收能力。',
                '每次请求相互独立；服务器默认不会记住上一次请求的上下文。',
                'retrieve 常强调检索取回；recall 常强调从记忆中想起。'
            ];
            ui.material = materials[Number(button.dataset.index)] || ui.material;
            dialog.close();
            ui.studioMode = 'manual';
            setPage('studio');
            notify('材料已载入手工制卡工作面，来源仍需在保存前核对。');
            return;
        }
        if (action === 'recovery-restore-suspended') {
            event.preventDefault();
            event.stopImmediatePropagation();
            const cardID = button.dataset.card;
            ui.recoverySuspendedIDs = ui.recoverySuspendedIDs.filter(id => id !== cardID);
            openRecoveryMaintenance();
            notify('已恢复这张卡今天的复习安排。');
            return;
        }

        if (action === 'open-reschedule') {
            event.preventDefault();
            event.stopImmediatePropagation();
            ui.rescheduleOpen = true;
            render();
            queueMicrotask(() => main.querySelector('#reschedule-days')?.focus());
            return;
        }
        if (action === 'close-reschedule') {
            event.preventDefault();
            event.stopImmediatePropagation();
            if (ui.rescheduleBusy) return;
            ui.rescheduleOpen = false;
            ui.rescheduleRetryReady = false;
            ui.rescheduleTarget = null;
            ui.rescheduleError = '';
            render();
            return;
        }
        if (action === 'reschedule-submit') {
            event.preventDefault();
            event.stopImmediatePropagation();
            submitRescheduleDemo(ui.rescheduleRetryReady);
            return;
        }

        if (action === 'inspect-deck') {
            event.preventDefault();
            event.stopImmediatePropagation();
            ui.deck = '网络基础';
            ui.filter = 'due';
            setPage('library');
            return;
        }
        if (action === 'cancel-load') {
            event.preventDefault();
            event.stopImmediatePropagation();
            ui.scene = 'ready';
            render();
            notify('已取消读取；当前样例数据保留，正式复习入口已恢复。');
            return;
        }
        if ((action === 'start-review' || action === 'continue-review') && blockedReviewScenes.has(ui.scene)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            notify('当前到期范围或评分仍在核对，暂不能开始正式复习。');
            return;
        }
        if (action === 'reconcile') {
            event.preventDefault();
            event.stopImmediatePropagation();
            ui.scene = 'ready';
            render();
            notify('核对完成：上一笔未写入，本卡仍待评分，可继续一次。');
            return;
        }
        if ((action === 'manual' || action === 'setup-manual' || (action === 'studio-mode' && button.dataset.mode === 'manual')) && ui.scene.startsWith('ai')) {
            ui.scene = 'ready';
        }
    }, true);

    document.addEventListener('input', event => {
        const input = event.target;
        if (!(input instanceof HTMLInputElement) || input.id !== 'reschedule-days') return;
        ui.rescheduleDays = input.valueAsNumber;
        ui.rescheduleTarget = null;
        ui.rescheduleError = '';
        const valid = Number.isSafeInteger(ui.rescheduleDays) && ui.rescheduleDays >= 1 && ui.rescheduleDays <= 36500;
        input.setAttribute('aria-invalid', String(!valid));
        const preview = document.getElementById('reschedule-preview');
        if (preview) preview.textContent = rescheduleTargetLabel(valid ? Date.now() + ui.rescheduleDays * 86400000 : null);
        const submit = main.querySelector('[data-action="reschedule-submit"]');
        if (submit) submit.disabled = !valid || ui.rescheduleBusy;
    });

    document.addEventListener('change', event => {
        const input = event.target;
        if (input instanceof HTMLInputElement && input.id === 'reschedule-fail-first') {
            ui.rescheduleFailFirst = input.checked;
        }
    });

    render();
})();
</script>
</body>
</html>
