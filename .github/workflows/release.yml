name: Create Release on Tag Push

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7.0.1; keep the SHA pin and let Dependabot update it.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pnpm
        # 版本单一事实源 = package.json packageManager（v0.149.1 同类教训：此处硬编码会漂移）
        # v6.1.0; supports pnpm 12 and keeps packageManager authoritative.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false

      - name: Install Node.js
        # v7.0.0; runs on the current Node 24 action runtime.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          plugin_version="$(node -p "require('./plugin.json').version")"

          if [[ "$GITHUB_REF_NAME" != v* || -z "$tag_version" ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME (expected v<version>)"
            exit 1
          fi

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version ($tag_version) does not match package.json ($package_version)"
            exit 1
          fi

          if [[ "$tag_version" != "$plugin_version" ]]; then
            echo "Tag version ($tag_version) does not match plugin.json ($plugin_version)"
            exit 1
          fi

          echo "Release version validated: $tag_version"

      - name: Check source
        run: pnpm check

      - name: Check tests
        run: pnpm test -- --run

      - name: Check documentation facts
        run: pnpm check:docs-facts

      - name: Build production package
        run: |
          pnpm build
          cd dist
          zip -r ../package.zip .

      - name: Check repository governance
        run: node scripts/check-governance.mjs

      - name: Verify tag points to main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag commit ($GITHUB_SHA) is not reachable from origin/main"
            exit 1
          fi

      - name: Verify release archive
        shell: bash
        run: |
          test -s package.zip
          archive_listing="$(unzip -l package.zip)"
          grep -qE '[[:space:]](\./)?plugin.json$' <<< "$archive_listing"
          grep -qE '[[:space:]](\./)?index.js$' <<< "$archive_listing"
          if grep -qE '[[:space:]](\./)?asset/' <<< "$archive_listing"; then
            echo "Unexpected asset directory in release archive"
            exit 1
          fi
          sha256sum package.zip > package.zip.sha256

      - name: Prepare release notes
        shell: bash
        run: |
          checksum="$(cut -d' ' -f1 package.zip.sha256)"
          cat > release-notes.md <<EOF
          ## v${GITHUB_REF_NAME#v}

          Source commit: ${GITHUB_SHA}
          Package SHA-256: ${checksum}

          This release passed the repository CI, documentation, governance, test, and production-package checks.

          Host acceptance remains separate from CI: real SiYuan desktop walkthroughs, Android, real AI provider error matrices, multi-window synchronization, and third-party-theme/accessibility checks require the environments listed in docs/34.
          EOF

      - name: Release
        # v1.21.0; keep the SHA pin and let Dependabot update it.
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd
        with:
          artifactErrorsFailBuild: true
          artifacts: "package.zip,package.zip.sha256"
          bodyFile: release-notes.md
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
