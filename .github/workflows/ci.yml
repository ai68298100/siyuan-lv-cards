name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check (tsc + svelte-check)
        run: pnpm check
      - name: i18n key alignment
        run: node scripts/check-i18n.mjs
      - name: Build (app + kernel)
        run: pnpm build
