name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check (tsc + svelte-check)
        run: pnpm check
      - name: i18n key alignment
        run: node scripts/check-i18n.mjs
      - name: Governance consistency (docs/17 ↔ docs/31)
        run: node scripts/check-governance.mjs
      - name: Unit tests
        run: pnpm test
      - name: Build (app + kernel)
        run: pnpm build
      - name: Gzip budget gate (index.js <= 32KB)
        run: node -e "const{readFileSync}=require('node:fs');const{gzipSync}=require('node:zlib');const g=gzipSync(readFileSync('dist/index.js')).length;console.log('index.js gzip:',(g/1024).toFixed(2)+'KB');if(g>32*1024){console.error('over 32KB budget');process.exit(1)}"
